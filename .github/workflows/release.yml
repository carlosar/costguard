name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Lets semantic-release publish to npm via OIDC trusted publishing
      # (short-lived credentials, nothing stored, nothing to expire) instead of
      # a long-lived NPM_TOKEN. Requires a trusted publisher configured for this
      # package on npmjs.com; it falls back to NPM_TOKEN if that is absent.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Node 22 bundles npm 10.x; OIDC trusted publishing needs 11.5.1+.
      # Cheap insurance against a failed release cycle.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Fail before semantic-release publishes anything. vsce publish runs after
      # npm publish and the git tag, so an expired PAT used to leave a partial
      # release: live on npm, tagged in git, but never on the Marketplace.
      - name: Verify Marketplace token
        run: npx vsce verify-pat soarone --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@martynus.net
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@martynus.net
